[project]
name = "show-receipts"
version = "0.1.0"
description = "A Stop hook that makes coding agents prove \"tests pass\" before they say it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Tanbir Hossain Ramim" }]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
