name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
      - name: Plugin manifests are valid JSON
        run: python -c "import json,sys; [json.load(open(f)) for f in sys.argv[1:]]" .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json examples/claude-settings.json examples/codex-hooks.json examples/gemini-settings.json examples/show-receipts.json examples/user-config.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .
